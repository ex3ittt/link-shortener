services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://links:links@db:5432/links
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: links
      POSTGRES_PASSWORD: links
      POSTGRES_DB: links
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U links"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
